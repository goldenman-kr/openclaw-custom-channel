<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e2e8f0" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenClaw" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OpenClaw Mobile</title>
    <link rel="manifest" href="/manifest.webmanifest?v=pwa-client-2026-07-09-markdown-heading-rhythm-001" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/openclaw-app-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/openclaw-app-icon-180.png" />
    <link rel="stylesheet" href="/styles.css?v=pwa-client-2026-07-09-markdown-heading-rhythm-001" />
  </head>
  <body>
    <section id="loginScreen" class="login-screen hidden" aria-label="로그인">
      <form id="loginForm" class="login-card">
        <div class="login-brand">OpenClaw</div>
        <h1>로그인</h1>
        <label>
          ID
          <input id="loginUsernameInput" type="text" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="loginPasswordInput" type="password" autocomplete="current-password" required />
        </label>
        <button id="loginSubmitButton" type="submit">로그인</button>
        <p id="loginStatusText" class="status-text"></p>
      </form>
    </section>

    <main class="app-shell">
      <div id="mobileDrawerBackdrop" class="drawer-backdrop" data-drawer-close></div>

      <aside id="conversationSidebar" class="conversation-sidebar" aria-label="대화 목록">
        <div class="sidebar-header">
          <button id="sidebarMenuButton" class="ghost-button mobile-menu-button" type="button" aria-label="대화 목록 닫기" aria-expanded="false" aria-controls="conversationSidebar">
            <img class="mobile-menu-icon" src="/icons/list.svg?v=pwa-client-2026-07-09-markdown-heading-rhythm-001" alt="" aria-hidden="true" />
          </button>
          <div class="sidebar-title-block" aria-live="polite">
            <strong id="sidebarOwnerTitle">대화</strong>
            <span id="sidebarConversationCount">대화 0개</span>
          </div>
          <button id="newConversationButton" class="ghost-button sidebar-new-button" type="button" aria-label="새 대화" title="새 대화">
            <img class="sidebar-new-icon" src="/icons/newchat2.svg?v=pwa-client-2026-07-09-markdown-heading-rhythm-001" alt="" aria-hidden="true" />
          </button>
        </div>
        <nav id="conversationList" class="conversation-list" aria-label="대화 목록"></nav>
        <label class="conversation-search" aria-label="대화 검색">
          <span class="conversation-search-icon" aria-hidden="true">⌕</span>
          <input id="conversationSearchInput" type="search" placeholder="대화 검색" autocomplete="off" />
          <button id="clearConversationSearchButton" class="clear-message-input-button conversation-search-clear hidden" type="button" aria-label="검색어 지우기">×</button>
        </label>
        <div id="sidebarResizeHandle" class="sidebar-resize-handle" role="separator" aria-orientation="vertical" aria-label="대화 목록 너비 조절" title="드래그해서 대화 목록 너비 조절"></div>
        <div class="sidebar-footer">
          <button id="archiveToggleButton" class="ghost-button sidebar-archive-button" type="button">
            <span class="sidebar-button-icon sidebar-button-icon--archive" aria-hidden="true"></span>
            <span class="sidebar-button-label">보관함</span>
          </button>
          <button id="logoutButton" class="ghost-button sidebar-logout-button" type="button">로그아웃</button>
          <button id="sidebarSettingsButton" class="ghost-button sidebar-settings-button" type="button">
            <span class="sidebar-button-icon sidebar-button-icon--settings" aria-hidden="true"></span>
            <span>설정</span>
          </button>
        </div>
      </aside>

      <section class="chat-panel" aria-label="채팅">
        <header class="chat-titlebar">
          <button id="mobileMenuButton" class="ghost-button mobile-menu-button" type="button" aria-label="대화 목록 열기" aria-expanded="false" aria-controls="conversationSidebar">
            <img class="mobile-menu-icon" src="/icons/list.svg?v=pwa-client-2026-07-09-markdown-heading-rhythm-001" alt="" aria-hidden="true" />
          </button>
          <div class="chat-title-group">
            <h1 id="chatTitle" class="chat-title">OpenClaw</h1>
            <button id="copyConversationLinkButton" class="ghost-button copy-conversation-link-button hidden" type="button" aria-label="대화 링크 복사" title="대화 링크 복사">
              <svg class="copy-conversation-link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="9" y="9" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
                <path d="M5 15V7a2 2 0 0 1 2-2h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>
          </div>
          <div class="chat-titlebar-actions">
            <button id="modelPickerButton" class="ghost-button model-picker-button" type="button" aria-label="AI 모델 선택" aria-expanded="false" aria-controls="modelPickerPanel">
              <img class="model-picker-icon" src="/icons/ai.svg?v=pwa-client-2026-07-09-markdown-heading-rhythm-001" alt="" aria-hidden="true" />
            </button>
            <div id="modelPickerPanel" class="model-picker-panel hidden" role="menu" aria-label="AI 모델 목록">
              <div id="modelPickerStatus" class="model-picker-status">모델 목록을 불러오는 중입니다…</div>
              <div id="modelPickerList" class="model-picker-list"></div>
            </div>
          </div>
        </header>
        <div id="floatingActionMenu" class="floating-action-menu">
          <div id="floatingActionPanel" class="floating-action-panel hidden" role="menu" aria-label="빠른 작업">
            <button id="floatingChatSearchButton" class="ghost-button floating-action-item" type="button" role="menuitem">
              <span class="floating-action-text">
                <span class="floating-action-title">
                  <span class="floating-action-icon" aria-hidden="true">🔍</span>
                  <strong>대화 내 검색</strong>
                </span>
                <small>현재 대화방에서 메시지 내용을 찾습니다.</small>
              </span>
            </button>
            <button id="floatingSettingsButton" class="ghost-button floating-action-item" type="button" role="menuitem">
              <span class="floating-action-text">
                <span class="floating-action-title">
                  <span class="floating-action-icon" aria-hidden="true">⚙️</span>
                  <strong>설정</strong>
                </span>
                <small>API, 테마, 알림 등 앱 설정을 엽니다.</small>
              </span>
            </button>
            <button id="floatingRefreshButton" class="ghost-button floating-action-item" type="button" role="menuitem">
              <span class="floating-action-text">
                <span class="floating-action-title">
                  <span class="floating-action-icon" aria-hidden="true">↻</span>
                  <strong>새로고침</strong>
                </span>
                <small>앱 화면과 대화 기록을 다시 불러옵니다.</small>
              </span>
            </button>
            <button id="continueNewSessionButton" class="ghost-button floating-action-item" type="button" role="menuitem">
              <span class="floating-action-text">
                <span class="floating-action-title">
                  <span class="floating-action-icon" aria-hidden="true">🆕</span>
                  <strong>새 세션으로 이어가기</strong>
                </span>
                <small>최근 대화 맥락을 새 OpenClaw 세션에 전달하고 이어갑니다.</small>
              </span>
            </button>
            <div class="floating-action-compact-row" role="group" aria-label="스크롤 이동">
              <button id="floatingScrollTopButton" class="ghost-button floating-action-compact-item" type="button">맨위로</button>
              <button id="floatingScrollBottomButton" class="ghost-button floating-action-compact-item" type="button">맨아래로</button>
            </div>
          </div>
          <button id="floatingActionToggle" class="ghost-button floating-action-toggle" type="button" aria-label="빠른 작업 열기" aria-expanded="false" aria-controls="floatingActionPanel" title="빠른 작업"><span class="floating-action-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <div id="chatSearchOverlay" class="chat-search-overlay hidden" role="search" aria-label="대화 내 검색">
          <input id="chatSearchInput" type="search" placeholder="현재 대화방 검색" autocomplete="off" />
          <button id="chatSearchSubmitButton" class="ghost-button chat-search-button" type="button">검색</button>
          <button id="chatSearchPrevButton" class="ghost-button chat-search-nav-button" type="button" aria-label="이전 검색 위치" title="이전 검색 위치">↑</button>
          <button id="chatSearchNextButton" class="ghost-button chat-search-nav-button" type="button" aria-label="다음 검색 위치" title="다음 검색 위치">↓</button>
          <span id="chatSearchStatus" class="chat-search-status" aria-live="polite"></span>
          <button id="chatSearchCloseButton" class="ghost-button chat-search-close-button" type="button" aria-label="검색 종료" title="검색 종료">×</button>
        </div>
        <button id="scrollToLatestButton" class="ghost-button scroll-latest-button hidden" type="button" aria-label="최신 응답으로 이동" title="최신 응답으로 이동">↓</button>

        <section id="settingsPanel" class="settings-panel hidden" aria-label="설정">
          <input id="apiUrlInput" type="hidden" />
          <div class="settings-group" role="group" aria-labelledby="locationSettingsTitle">
            <div class="settings-group-title" id="locationSettingsTitle">위치 자동 첨부</div>
            <label class="settings-checkbox">
              <input id="autoLocationOnHereInput" type="checkbox" />
              <span>‘여기’가 포함되면 현재 위치 자동 첨부</span>
            </label>
          </div>
          <label>
            Theme
            <select id="themeModeInput">
              <option value="system">System</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </label>
          <label>
            글자 크기
            <span class="range-row">
              <input id="fontSizeInput" type="range" min="12" max="20" step="1" />
              <output id="fontSizeValue" for="fontSizeInput">16px</output>
            </span>
          </label>
          <label>
            대화방 입장 시 불러올 최근 대화
            <select id="historyPageSizeInput">
              <option value="100">100개</option>
              <option value="200">200개</option>
              <option value="300">300개</option>
              <option value="400">400개</option>
              <option value="500">500개</option>
            </select>
          </label>
          <div class="settings-actions">
            <button id="refreshAppButton" class="ghost-button" type="button">새로고침</button>
            <button id="clearCacheButton" class="ghost-button" type="button">강력 새로고침</button>
            <button id="resetAppStateButton" class="ghost-button" type="button">앱 초기화</button>
            <button id="notificationButton" class="ghost-button" type="button">알림 허용</button>
            <button id="resetPasswordButton" class="ghost-button" type="button">비밀번호 재설정</button>
          </div>
        </section>

        <section id="messages" class="messages" aria-live="polite"></section>
        <div id="messagesScrollIndicator" class="messages-scroll-indicator" aria-hidden="true"></div>

        <div id="mediaViewer" class="media-viewer hidden" role="dialog" aria-modal="true" aria-label="이미지 보기">
          <div class="media-viewer-backdrop" data-media-viewer-close></div>
          <div class="media-viewer-panel">
            <div class="media-viewer-actions">
              <a id="mediaViewerDownload" class="ghost-button media-viewer-download" href="#" download>다운로드</a>
              <button id="mediaViewerClose" class="ghost-button" type="button" aria-label="닫기">닫기</button>
            </div>
            <img id="mediaViewerImage" alt="첨부 이미지" />
          </div>
        </div>

        <form id="messageForm" class="composer">
          <input id="attachmentInput" class="hidden-file-input" type="file" multiple accept="*/*" />
          <div id="attachmentTray" class="attachment-tray hidden" aria-live="polite"></div>
          <div id="slashCommandPalette" class="slash-command-palette hidden" aria-label="슬래시 명령어" role="listbox"></div>
          <div class="input-row">
            <div class="composer-tools" aria-label="입력 도구">
              <label class="location-toggle" title="현재위치 포함" aria-label="현재위치 포함">
                <input id="includeLocationInput" type="checkbox" />
                <span aria-hidden="true">📍</span>
              </label>
              <button id="attachButton" class="attach-button" type="button" aria-label="파일 첨부">＋</button>
            </div>
            <div class="message-input-wrap">
              <textarea id="messageInput" rows="2" placeholder="메시지를 입력하세요"></textarea>
              <button id="clearMessageInputButton" class="clear-message-input-button hidden" type="button" aria-label="입력 내용 지우기">×</button>
            </div>
            <button id="sendButton" type="submit" aria-label="전송" title="전송">
              <svg class="send-button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 19V5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                <path d="M5.75 11.25 12 5l6.25 6.25" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <p id="statusText" class="status-text"></p>
        </form>
      </section>
    </main>

    <dialog id="conversationRenameDialog" class="conversation-dialog">
      <form method="dialog" class="conversation-dialog-panel">
        <h2>대화 이름 변경</h2>
        <label>
          새 이름
          <input id="conversationRenameInput" type="text" maxlength="120" autocomplete="off" />
        </label>
        <menu class="conversation-dialog-actions">
          <button id="conversationRenameCancel" class="ghost-button" type="button" value="cancel">취소</button>
          <button id="conversationRenameConfirm" type="button" value="confirm">변경</button>
        </menu>
      </form>
    </dialog>

    <dialog id="conversationDeleteDialog" class="conversation-dialog">
      <form method="dialog" class="conversation-dialog-panel">
        <h2>대화 삭제</h2>
        <p id="conversationDeleteText" class="conversation-dialog-text">이 대화를 삭제할까요?</p>
        <p class="conversation-dialog-warning">대화 내용과 연결된 OpenClaw 세션이 삭제됩니다. 이 작업은 되돌릴 수 없습니다.</p>
        <menu class="conversation-dialog-actions">
          <button id="conversationDeleteCancel" class="ghost-button" type="button" value="cancel">취소</button>
          <button id="conversationDeleteConfirm" class="danger-button" type="button" value="confirm">삭제</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/app.js?v=pwa-client-2026-07-09-markdown-heading-rhythm-001"></script>
  </body>
</html>
